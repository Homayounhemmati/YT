name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: npm ci

      # The dataset gates everything: a bad number here is wrong on every page.
      - name: Validate tax dataset
        run: python3 scripts/validate_tax_data.py --year 2026

      # Every value a page relies on must still match the primary source recorded
      # in data/tax-primary; a hand edit to a verified dataset fails here.
      - name: Primary-source register
        run: |
          python3 scripts/apply_primary_sources.py --year 2026
          git diff --exit-code -- src/data/tax-year-2026 || {
            echo "::error::the datasets disagree with data/tax-primary/2026.json — re-run scripts/apply_primary_sources.py and commit"; exit 1; }

      # Two pages competing for one query is invisible until it has already
      # cost rankings. Catch it in the plan, not in Search Console.
      - name: Cannibalisation and canonical audit
        run: python3 scripts/audit_seo.py

      # The whole project is one language. A stray Persian string in data/
      # becomes a Persian meta description on a live page.
      # 51 hand-typed titles is 51 chances to drift from the formula. The values
      # are generated, and the generator re-validates them against the same limits.
      # The FAQ take-home figures are computed by the engine, never estimated.
      - name: Compute take-home figures
        run: npx tsx scripts/compute_takehome.ts

      # Metro household costs and the salary that covers them, from BEA, HUD and
      # BLS data through the same engines. A committed copy that differs from a
      # fresh one means the data or an engine changed without regenerating it.
      - name: Compute metro figures
        run: |
          npx tsx scripts/compute_metro_figures.ts
          git diff --exit-code -- data/metro-figures.json data/takehome-95k.json || {
            echo "::error::generated figures are stale — re-run the compute scripts and commit"; exit 1; }

      - name: Generate and validate per-entity on-page values
        run: python3 scripts/generate_onpage.py

      # The acceptance table is what the platform build is checked against. It is
      # generated from the tested engines; a committed copy that differs from a
      # fresh one means an engine changed and the table was not regenerated.
      - name: Calculator acceptance cases are in sync with the engines
        run: |
          npx tsx scripts/acceptance_cases.ts
          git diff --exit-code docs/calculator-acceptance.md data/takehome-95k.json

      # Link equity is not distributed by intention, it is distributed by the
      # graph. A page that carries 16% of the demand and receives 5% of the
      # internal links will not rank for it, and nothing else in the audit
      # notices. The entity templates are expanded first: 26 declared rows are
      # 105 real URLs, and collapsing them hides where the equity actually goes.
      - name: Internal link equity against demand (the planned programme)
        run: python3 scripts/analyze_link_equity.py --planned

      # Launch-day equity depends on how many gated pages have been written, so
      # it is reported by launch_readiness.py rather than failing the build.
      - name: Launch readiness report
        run: python3 scripts/launch_readiness.py

      # Audits the OUTPUT, not the rules that produced it. Every defect this
      # catches was invisible in data/pages.json and obvious in the generated
      # page: a breadcrumb whose parent was the page itself, a dateModified of
      # "2026", a title that shipped the literal "{Primary}", and 54 pages
      # linking to a literal "{metro}" URL. A template is not reviewable; its
      # output is.
      - name: Audit the generated on-page output
        run: python3 scripts/audit_onpage_output.py

      # Every number in tool copy must be traceable to a test, a dataset or a
      # named source. Six published figures were wrong before this existed.
      - name: Every published number is registered
        run: python3 scripts/audit_claims.py

      # Thin content is the failure mode that sinks programmatic sites, and it is
      # invisible until traffic never arrives. Measure it, do not assume it.
      # No-ops until the dataset is built outside the sandbox (13-6), then guards it.
      - name: Validate cost-of-living dataset
        run: python3 scripts/validate_cost_of_living.py --year 2024

      - name: Content uniqueness budget
        run: |
          python3 scripts/validate_content.py
          # Written pages are held to the threshold against each other. As more
          # bodies are added the test gets harder on its own, which is the point.
          python3 scripts/validate_content.py --bodies content/bodies --pilot

      # The handoff package: complete (every built page has its body, every file
      # the start document names is present) and the bundled engine identical to
      # the tested engines, case by case.
      - name: Base44 package is complete and matches the engines
        run: python3 scripts/package_base44.py

      - name: Everything is English
        run: python3 scripts/check_language.py

      - name: Typecheck
        run: npm run typecheck

      - name: Tax engine tests
        run: npm test
